<style data-purpose="base-styling">
    body {
      background-color: #ECEEF2;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Smooth custom checkbox */
    .custom-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 1.25rem;
      height: 1.25rem;
      border: 1.8px solid #CBD5E1;
      border-radius: 6px;
      display: inline-grid;
      place-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      background-color: #FFFFFF;
    }

    .custom-checkbox::before {
      content: "";
      width: 0.65rem;
      height: 0.65rem;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em white;
      transform-origin: center;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }

    .custom-checkbox:checked {
      background-color: #102A45;
      border-color: #102A45;
    }

    .custom-checkbox:checked::before {
      transform: scale(1);
    }

    /* iOS mock scrollbar styling */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style data-purpose="micro-interactions">
    .tap-press:active {
      transform: scale(0.985);
      transition: transform 0.1s ease;
    }

<div class="w-5 h-1 bg-emerald-500 rounded-full"></div>

<!-- BEGIN: Interactive Micro-behavior Script -->
<script data-purpose="toggle-password">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.querySelector('button[title="Show or hide password"]');
      const passInput = document.getElementById('password');

      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passInput.getAttribute('type') === 'password';
          passInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          const icon = toggleBtn.querySelector('i');
          if (icon) {
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
          }
        });
      }
    });
  </script>
<!-- END: Interactive Micro-behavior Script -->
