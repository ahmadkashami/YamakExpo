<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Yamak · Drawer — DESIGN SAMPLE (A7.6)</title>
<!-- Tailwind CSS v3 (design sample only) -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // Exact tokens from src/theme/colors.ts
          navyDeep: '#0B2A4A',
          wordmark: '#E9A319',
          goldTint: '#FDF7E6',
          goldTintBorder: '#FBEED4',
          fieldText: '#1E293B',
          subtitle: '#64748B',
          tagline: '#94A9C3',
          scrim: 'rgba(12,28,51,0.55)'
        },
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); }
</style>
</head>
<body class="bg-slate-200 flex justify-center items-start sm:items-center min-h-screen font-sans antialiased text-slate-800 select-none p-0 sm:p-6">

<!-- ============================= DESIGN SAMPLE LABEL ============================= -->
<div class="fixed top-0 inset-x-0 z-[100] bg-amber-400 text-slate-900 text-center text-[11px] font-bold tracking-wide py-1.5 shadow">
  DESIGN SAMPLE — A7.6 drawer visual reference. NOT app content. Identity/version values shown are placeholders.
</div>

<!-- ============================= MOBILE DEVICE FRAME ============================= -->
<main class="relative w-full max-w-[412px] h-[880px] max-h-[100dvh] mt-7 sm:mt-0 bg-white overflow-hidden shadow-2xl sm:rounded-[36px] border-0 sm:border-8 border-slate-900">

  <!-- ---------- UNDERLYING SCREEN (Home) — dimmed when drawer is open ---------- -->
  <div class="absolute inset-0 flex flex-col">
    <!-- iOS status bar -->
    <header class="bg-[#081C31] text-white px-6 pt-3 pb-1 flex justify-between items-center text-xs">
      <span class="font-semibold">9:41</span>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] font-bold">5G</span>
        <div class="w-6 h-3 border border-white/80 rounded-sm p-[1.5px] flex items-center">
          <div class="h-full w-4 bg-emerald-400 rounded-sm"></div>
        </div>
      </div>
    </header>
    <!-- Navy app header (approved Home header language) -->
    <section class="bg-gradient-to-b from-[#081C31] via-[#0B2A4A] to-[#153359] text-white px-5 pt-3 pb-6 rounded-b-[28px] shadow-lg">
      <div class="flex justify-between items-center">
        <button aria-label="Menu" class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center border border-white/10">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <div class="flex items-center gap-2.5 bg-white/10 px-3.5 py-1.5 rounded-full border border-white/15">
          <div class="w-7 h-7 rounded-full bg-white flex items-center justify-center text-[11px] font-black text-[#0B2A4A]">Y</div>
          <div class="flex flex-col items-start leading-none">
            <span class="text-sm font-black tracking-wide text-white">YAMAK</span>
            <span class="text-[9px] text-slate-300 font-medium">Kuwait Road Mobility</span>
          </div>
        </div>
        <button aria-label="Notifications" class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center border border-white/10">
          <svg class="w-5 h-5 text-[#E9A319]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2a6 6 0 0 0-6 6v3.586l-.707.707A1 1 0 0 0 5 13h14a1 1 0 0 0 .707-1.707L19 11.586V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 2.83-2h-5.66A3 3 0 0 0 12 22z"></path>
          </svg>
        </button>
      </div>
      <div class="mt-4 px-1">
        <h1 class="text-lg font-bold text-white">Need help on Kuwait roads?</h1>
      </div>
    </section>
    <!-- Filler content -->
    <div class="flex-1 px-4 pt-4 space-y-3 overflow-hidden">
      <div class="h-24 rounded-2xl bg-slate-100 border border-slate-200"></div>
      <div class="h-24 rounded-2xl bg-slate-100 border border-slate-200"></div>
      <div class="h-24 rounded-2xl bg-slate-100 border border-slate-200"></div>
    </div>
    <!-- Bottom tab bar (Home active, gold dot) -->
    <nav class="bg-white border-t border-slate-200 px-6 py-2 pb-6 flex justify-around items-center">
      <div class="flex flex-col items-center">
        <span class="w-1.5 h-1.5 bg-[#E9A319] rounded-full mb-1"></span>
        <svg class="w-5 h-5 fill-[#0B2A4A]" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"></path></svg>
        <span class="text-[11px] font-bold text-[#0B2A4A] mt-0.5">Home</span>
      </div>
      <div class="flex flex-col items-center text-slate-400 pt-2.5">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934a1.12 1.12 0 01-1.006 0L9.503 3.314a1.125 1.125 0 00-1.006 0L3.622 5.75A1.125 1.125 0 003 6.756v11.424c0 .836.88 1.38 1.628 1.006l3.869-1.934a1.12 1.12 0 011.006 0l4.994 2.497c.317.158.69.158 1.006 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span class="text-[11px] font-medium mt-0.5">Map</span>
      </div>
      <div class="flex flex-col items-center text-slate-400 pt-2.5">
        <svg class="w-5 h-5 text-slate-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
        <span class="text-[11px] font-medium mt-0.5">Profile</span>
      </div>
    </nav>
  </div>

  <!-- ---------- SCRIM (navy-tinted, tap closes) ---------- -->
  <div class="absolute inset-0" style="background: var(--tw-scrim, rgba(12,28,51,0.55)); background: rgba(12,28,51,0.55);"></div>

  <!-- ---------- DRAWER ---------- -->
  <aside class="absolute left-0 top-0 h-full w-[304px] max-w-[85%] bg-white flex flex-col rounded-r-2xl overflow-hidden shadow-xl">

    <!-- Identity cap (navy, full bleed to top) -->
    <div class="bg-[#0B2A4A] pt-9 px-5 pb-4 flex flex-col items-center text-center">
      <!-- Avatar: glass circle + gold ring, initials -->
      <div class="rounded-full p-[2px]" style="border: 2px solid #E9A319;">
        <div class="w-16 h-16 rounded-full flex items-center justify-center glass">
          <span class="text-[22px] leading-7 font-bold text-white">SA</span>
        </div>
      </div>
      <div class="mt-3 text-[16px] leading-[22px] font-semibold text-white">Sarah Al-Ali</div>
      <div class="mt-0.5 text-[12px] leading-4 font-normal text-[#94A9C3] break-all">sarah.alali@example.com</div>
    </div>

    <!-- Menu (white body) -->
    <nav class="flex-1 px-4 pt-4 space-y-1">
      <!-- Home — ACTIVE: gold tint + border + leading gold accent bar + navy content -->
      <a href="#" aria-current="page" class="relative flex items-center min-h-[52px] rounded-xl bg-[#FDF7E6] border border-[#FBEED4] pl-4 pr-3">
        <span class="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-6 rounded-full bg-[#E9A319]"></span>
        <span class="w-5 h-5 flex items-center justify-center mr-3">
          <svg class="w-5 h-5 fill-[#0B2A4A]" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"></path></svg>
        </span>
        <span class="text-[15px] leading-5 font-semibold text-[#0B2A4A]">Home</span>
      </a>
      <!-- Map — inactive -->
      <a href="#" class="flex items-center min-h-[52px] rounded-xl pl-4 pr-3">
        <span class="w-5 h-5 flex items-center justify-center mr-3">
          <svg class="w-5 h-5 text-[#64748B]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934a1.12 1.12 0 01-1.006 0L9.503 3.314a1.125 1.125 0 00-1.006 0L3.622 5.75A1.125 1.125 0 003 6.756v11.424c0 .836.88 1.38 1.628 1.006l3.869-1.934a1.12 1.12 0 011.006 0l4.994 2.497c.317.158.69.158 1.006 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
        <span class="text-[15px] leading-5 font-medium text-[#1E293B]">Map</span>
      </a>
      <!-- Profile — inactive -->
      <a href="#" class="flex items-center min-h-[52px] rounded-xl pl-4 pr-3">
        <span class="w-5 h-5 flex items-center justify-center mr-3">
          <svg class="w-5 h-5 fill-[#64748B]" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
        </span>
        <span class="text-[15px] leading-5 font-medium text-[#1E293B]">Profile</span>
      </a>
    </nav>

    <!-- Footer — truthful version only -->
    <div class="pb-6 pt-2 flex items-center justify-center">
      <span class="text-[12px] leading-4 font-medium text-[#64748B]">Version 1.0.0</span>
    </div>
  </aside>

  <!-- iOS home indicator (decorative) -->
  <div class="absolute bottom-1 inset-x-0 flex justify-center pointer-events-none z-50">
    <div class="w-32 h-1 bg-slate-900/30 rounded-full"></div>
  </div>
</main>
</body>
</html>
